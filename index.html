
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Onam Celebration Poster</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f4d03f 0%, #16a085 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      margin: 0;
    }

    .poster {
      background: #fffbea;
      color: #2c3e50;
      border-radius: 20px;
      padding: 3rem 2rem 5rem;
      width: 100%;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      position: relative;
      overflow: hidden;
    }

    .poster::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 8px;
      background: linear-gradient(90deg, #ff6b6b, #ffd93d, #6bcf7f, #ff9f1c);
    }

    .hero-visual {
      margin: 0 auto 2rem;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: repeating-conic-gradient(
        #ff9f1c 0deg 30deg,
        #ff6b6b 30deg 60deg,
        #6bcf7f 60deg 90deg,
        #ffd93d 90deg 120deg
      );
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      animation: spin 20s linear infinite;
    }

    .hero-visual::before {
      content: '';
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #fffbea;
      position: absolute;
    }

    .hero-visual::after {
      content: '🌺';
      font-size: 2rem;
      position: absolute;
      z-index: 2;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .festival-name {
      font-family: 'Playfair Display', serif;
      font-size: 3.5rem;
      font-weight: 700;
      color: #f77f00;
      margin: 1rem 0;
      letter-spacing: 2px;
      transition: all 0.3s ease;
    }

    .festival-name:hover {
      color: #d62828;
      text-shadow: 0 0 10px gold, 0 0 20px orange;
    }
    
    .join-text, .celebration-text {
      font-weight: 600;
      text-transform: uppercase;
    }

    .join-text {
      font-size: 1.2rem;
      color: #d62828;
      letter-spacing: 4px;
      margin-bottom: 0.5rem;
    }

    .celebration-text {
      font-size: 1.3rem;
      color: #2a9d8f;
      letter-spacing: 3px;
      margin-top: 0.5rem;
    }

    .description {
      font-size: 1rem;
      color: #444;
      margin: 1.5rem 0;
      line-height: 1.6;
      font-weight: 400;
    }

    .event-details {
      background: linear-gradient(135deg, #f77f00 0%, #d62828 100%);
      color: white;
      padding: 1.2rem;
      border-radius: 15px;
      margin: 1.5rem 0 0;
      box-shadow: 0 8px 25px rgba(214, 40, 40, 0.3);
    }

    .date-time {
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: 1px;
    }

    .boat {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 300px;
      height: 40px;
      background: #3e2723;
      border-radius: 0 0 50% 50%;
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      padding-bottom: 15px;
      animation: rock 4s ease-in-out infinite;
    }

    @keyframes rock {
      0%, 100% { transform: translateX(-50%) rotate(0deg); }
      50% { transform: translateX(-50%) rotate(-2deg); }
    }

    .boat .oar {
      width: 6px;
      height: 30px;
      background: #3e2723;
      transform-origin: bottom center;
      animation: row 2s ease-in-out infinite;
    }

    .boat .oar:nth-child(even) {
      animation-delay: 1s;
    }

    @keyframes row {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-15deg); }
    }

    @media (max-width: 480px) {
      .poster {
        padding: 2rem 1.5rem 4rem;
      }
      .festival-name {
        font-size: 2.8rem;
      }
      .hero-visual {
        width: 150px;
        height: 150px;
      }
      .boat {
        width: 200px;
      }
    }
  </style>
</head>
<body>
  <div class="poster">
    <div class="hero-visual"></div>
    
    <div class="join-text">JOIN</div>
    <h1 class="festival-name">ONAM</h1>
    <div class="celebration-text">CELEBRATION</div>
    
    <p class="description">
      Celebrate this harvest festival with <b>joy</b>, <b>unity</b>, and <b>prosperity</b>.
    </p>
    
    <div class="event-details">
      <div class="date-time">
        🌺 SEPTEMBER 15, 2025 🌺<br>
        10:00 AM - 3:00 PM
      </div>
    </div>

    <div class="boat">
      <span class="oar"></span>
      <span class="oar"></span>
      <span class="oar"></span>
      <span class="oar"></span>
      <span class="oar"></span>
      <span class="oar"></span>
      <span class="oar"></span>
      <span class="oar"></span>
      <span class="oar"></span>
    </div>
  </div>
</body>
</html>
